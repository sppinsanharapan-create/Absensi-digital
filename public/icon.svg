<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f5132" />
      <stop offset="50%" stop-color="#0a3622" />
      <stop offset="100%" stop-color="#042014" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe padding for maskable -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Decorative Inner Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.4" stroke-dasharray="8 6"/>

  <!-- Central Shield / Emblem container -->
  <g filter="url(#dropShadow)">
    <!-- School Crest Shield -->
    <path d="M 256 90 
             C 340 90, 390 120, 390 190
             C 390 290, 256 385, 256 395
             C 256 395, 122 290, 122 190
             C 122 120, 172 90, 256 90 Z" 
          fill="#104A30" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Inner Shield Accent -->
    <path d="M 256 108 
             C 328 108, 372 134, 372 194
             C 372 280, 256 364, 256 372
             C 256 372, 140 280, 140 194
             C 140 134, 184 108, 256 108 Z" 
          fill="#0D3B27" stroke="rgba(245, 158, 11, 0.3)" stroke-width="3"/>

    <!-- Open Book of Knowledge (Al-Qur'an / Education) -->
    <path d="M 256 250 
             C 285 225, 335 220, 360 232 
             L 360 305 
             C 335 292, 285 297, 256 322 
             C 227 297, 177 292, 152 305 
             L 152 232 
             C 177 220, 227 225, 256 250 Z" 
          fill="#FFFFFF" />

    <!-- Book pages center spine -->
    <path d="M 256 250 L 256 322" stroke="#0f5132" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Left pages lines -->
    <path d="M 172 250 C 200 240, 230 244, 246 260" stroke="#0f5132" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 172 268 C 200 258, 230 262, 246 278" stroke="#0f5132" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Right pages lines -->
    <path d="M 340 250 C 312 240, 282 244, 266 260" stroke="#0f5132" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M 340 268 C 312 258, 282 262, 266 278" stroke="#0f5132" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- Crescent & Star (Islamic Identity) -->
    <path d="M 276 138 
             A 26 26 0 1 1 234 172 
             A 20 20 0 1 0 276 138 Z" 
          fill="url(#goldGrad)" />
    
    <!-- Star -->
    <polygon points="274,142 278,150 286,151 280,157 282,165 274,160 266,165 268,157 262,151 270,150" fill="url(#goldGrad)" />

    <!-- Attendance Checkmark & Person Silhouette / Ribbon -->
    <circle cx="256" cy="192" r="14" fill="url(#goldGrad)"/>
    <path d="M 238 218 C 238 206, 274 206, 274 218 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Banner at Bottom -->
  <g filter="url(#dropShadow)">
    <rect x="110" y="405" width="292" height="42" rx="10" fill="url(#goldGrad)"/>
    <text x="256" y="432" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" text-anchor="middle" fill="#042014" letter-spacing="1.5">SIT INSAN HARAPAN</text>
  </g>
</svg>
